<svg xmlns="http://www.w3.org/2000/svg" width="880" height="240" viewBox="0 0 880 240" role="img" aria-label="Juan Andrés Marín Cárdenas, desarrollador de software">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.55" stop-color="#14264f"/>
      <stop offset="1" stop-color="#0e5a8a"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#7dd3fc"/>
    </linearGradient>
    <radialGradient id="glow"><stop offset="0" stop-color="#38bdf8" stop-opacity=".55"/><stop offset="1" stop-color="#38bdf8" stop-opacity="0"/></radialGradient>
    <clipPath id="r"><rect width="880" height="240" rx="18"/></clipPath>
  </defs>
  <style>
    .t{font-family:'Segoe UI',Helvetica,Arial,sans-serif}
    .m{font-family:'Cascadia Code','Consolas','Courier New',monospace}
    .g1{animation:d1 9s ease-in-out infinite alternate}
    .g2{animation:d2 11s ease-in-out infinite alternate}
    @keyframes d1{to{transform:translate(160px,30px)}}
    @keyframes d2{to{transform:translate(-190px,-20px)}}
    .role{opacity:0;animation:cycle 12s infinite}
    .r1{animation-delay:0s}.r2{animation-delay:3s}.r3{animation-delay:6s}.r4{animation-delay:9s}
    @keyframes cycle{0%{opacity:0;transform:translateY(8px)}4%,21%{opacity:1;transform:translateY(0)}25%,100%{opacity:0;transform:translateY(-8px)}}
    .cur{animation:blink 1s steps(1) infinite}
    @keyframes blink{50%{opacity:0}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}.r1{opacity:1}}
  </style>
  <g clip-path="url(#r)">
    <rect width="880" height="240" fill="url(#bg)"/>
    <circle class="g1" cx="120" cy="60" r="190" fill="url(#glow)"/>
    <circle class="g2" cx="760" cy="200" r="210" fill="url(#glow)"/>
    <g opacity=".07" stroke="#fff"><path d="M0 60H880M0 120H880M0 180H880M220 0V240M440 0V240M660 0V240"/></g>
  </g>
  <text class="m" x="48" y="62" font-size="15" fill="#7dd3fc">&gt;_ hola, soy</text>
  <text class="t" x="46" y="118" font-size="46" font-weight="700" fill="url(#name)">Juan Andrés Marín</text>
  <g class="m" font-size="20" fill="#e2e8f0">
    <text class="role r1" x="48" y="164">Live Data Analyst · Python · Pandas</text>
    <text class="role r2" x="48" y="164">Modelado y calidad de datos</text>
    <text class="role r3" x="48" y="164">Desarrollador de software · Backend</text>
    <text class="role r4" x="48" y="164">Datos en tiempo real · Automatización</text>
  </g>
  <rect class="cur" x="48" y="182" width="12" height="3" fill="#7dd3fc"/>
  <text class="m" x="48" y="214" font-size="13" fill="#94a3b8">Medellín, Colombia · Ingeniería en Desarrollo de Software</text>
</svg>
